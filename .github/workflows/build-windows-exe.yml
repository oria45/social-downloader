name: Build Windows exe

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Download bundled tools (yt-dlp, gallery-dl, ffmpeg)
        run: |
          New-Item -ItemType Directory -Force -Path backend/tools | Out-Null

          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "backend/tools/yt-dlp.exe"
          # gallery-dl's active releases (with binary assets) moved to Codeberg -
          # the GitHub releases are changelog-only mirrors with no attached exe.
          # Codeberg (Gitea) supports the same /releases/download/latest/ alias.
          Invoke-WebRequest -Uri "https://codeberg.org/mikf/gallery-dl/releases/download/latest/gallery-dl.exe" -OutFile "backend/tools/gallery-dl.exe"

          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extracted"
          $ffmpegBin = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item "$ffmpegBin\ffmpeg.exe" "backend/tools/ffmpeg.exe"
          Copy-Item "$ffmpegBin\ffprobe.exe" "backend/tools/ffprobe.exe"

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt pyinstaller

      - name: Build with PyInstaller
        working-directory: backend
        run: |
          pyinstaller social-downloader.spec

      - name: Zip the build output
        run: |
          Compress-Archive -Path "backend/dist/social-downloader/*" -DestinationPath "social-downloader-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: social-downloader-windows
          path: social-downloader-windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: social-downloader-windows.zip
